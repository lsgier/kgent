[project]
name = "kgent"
version = "0.1.0"
description = "Agentic knowledge graph enrichment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.1",
    "pydantic-ai>=1.83.0",
    "python-dotenv>=1.2.2",
    "rdflib>=7.6.0",
    "scipy>=1.18.0",
    "sparqlwrapper>=2.0.0",
    "uvicorn[standard]>=0.32",
]

# Tunable parameters (committed for reproducibility; secrets/endpoints stay in .env).
[tool.kgent.cluster]
k = 20            # FAISS nearest neighbours per person
threshold = 0.99  # cosine similarity above which two persons are linked
name_similarity_penalty = 0.02  # raises the effective threshold for pairs sharing a common name; 0.0 = no-op

[tool.kgent.embedding]
model = "Qwen/Qwen3-Embedding-8B"
batch_size = 64   # persons per embedding request
concurrency = 6   # parallel embedding requests
fields = ["name", "location"]  # Person fields concatenated into the embedded text

[tool.kgent.cache]
enabled = true  # load persons from PERSONS_CACHE_PATH instead of SPARQL;

[tool.kgent.agent]
max_cluster_size = 25  # skip them, they blow past the LLM context window
